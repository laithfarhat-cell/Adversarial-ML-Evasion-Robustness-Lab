[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adversarial-ml-evasion-robustness-lab"
version = "1.0.0"
description = "Adversarial ML Evasion & Layered Robustness Laboratory for Tabular Cybersecurity Intrusion Detection Classifiers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "AI Security & ML Robustness Lab" }
]
keywords = [
    "adversarial-machine-learning",
    "cybersecurity",
    "intrusion-detection",
    "fgsm",
    "pgd",
    "adversarial-training",
    "feature-squeezing",
    "mahalanobis-ood",
    "pytorch",
]
dependencies = [
    "torch>=2.1.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "scipy>=1.11.0",
    "rich>=13.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "nbformat>=5.9.0",
    "nbclient>=0.8.0",
    "ipykernel>=6.25.0",
]

[project.scripts]
ids-robustness-lab = "main:main"

[tool.setuptools]
py-modules = ["main", "train_baseline"]

[tool.setuptools.packages.find]
where = ["."]
include = ["data*", "models*", "robustness*", "defenses*", "benchmarks*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
